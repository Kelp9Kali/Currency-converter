<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .container { max-width: 600px; margin-top: 2rem; }
        .currency-table td { cursor: pointer; transition: background 0.2s; }
        .currency-table td:hover { background: #e9ecef; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">Currency Converter 💱</h1>

        <form id="converter-form">
            <div class="mb-3">
                <label for="from" class="form-label">From currency:</label>
                <input type="text" class="form-control" id="from" name="from" placeholder="USD" required>
                <table class="table table-bordered mt-2 currency-table">
                    <tr>
                        <td class="currency-option" data-currency="USD">USD</td>
                        <td class="currency-option" data-currency="EUR">EUR</td>
                        <td class="currency-option" data-currency="RUB">RUB</td>
                    </tr>
                </table>
            </div>

            <div class="mb-3">
                <label for="to" class="form-label">To currency:</label>
                <input type="text" class="form-control" id="to" name="to" placeholder="RUB" required>
            </div>

            <div class="mb-3">
                <label for="amount" class="form-label">Amount:</label>
                <input type="number" class="form-control" id="amount" name="amount" step="0.01" placeholder="100" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">Convert</button>
        </form>

        <!-- Блок для вывода результата -->
        <div id="result" class="mt-4"></div>

        <p class="text-muted text-center small mt-3">Uses real-time exchange rates from exchangerate-api.com</p>
    </div>

    <script>
        // Заполнение поля "From" при клике на валюту в таблице
        document.querySelectorAll('.currency-option').forEach(cell => {
            cell.addEventListener('click', function() {
                document.getElementById('from').value = this.dataset.currency;
            });
        });

        // Обработка отправки формы
        document.getElementById('converter-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const from = document.getElementById('from').value.trim().toUpperCase();
            const to = document.getElementById('to').value.trim().toUpperCase();
            const amount = document.getElementById('amount').value.trim();

            if (!from || !to || !amount) {
                alert('Заполните все поля!');
                return;
            }

            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="alert alert-info">Загрузка...</div>';

            try {
                const response = await fetch(`/convert?from=${from}&to=${to}&amount=${amount}`);
                const data = await response.json();

                if (data.error) {
                    resultDiv.innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
                } else {
                    resultDiv.innerHTML = `
                        <div class="alert alert-success">
                            <strong>${data.amount} ${data.from}</strong> = 
                            <strong>${data.converted_amount} ${data.to}</strong><br>
                            <small class="text-muted">Rate: 1 ${data.from} = ${data.rate} ${data.to}</small>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = '<div class="alert alert-danger">Ошибка подключения к серверу. Убедитесь, что сервер запущен.</div>';
            }
        });
    </script>
</body>
</html>
